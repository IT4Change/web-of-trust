services:
  wot-fdroid:
    image: caddy:2-alpine
    container_name: wot-fdroid
    hostname: 'wot-fdroid'
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Nur repo/ mounten: der Container braucht weder Keystore noch config.yml
      # noch metadata/ — er serviert statisch. Secrets liegen auf dem Server
      # unter ~/secrets/wot-fdroid/, ausserhalb jedes Mounts.
      - ./fdroid/repo:/srv/fdroid/repo:ro
    networks:
      - "net"

networks:
  net:
    external: true
