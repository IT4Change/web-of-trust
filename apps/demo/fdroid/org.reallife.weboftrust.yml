  - Security
License: MIT
AuthorName: Anton Tranelis
AuthorEmail: info@real-life.org
WebSite: https://web-of-trust.de
SourceCode: https://github.com/real-life-org/web-of-trust
IssueTracker: https://github.com/real-life-org/web-of-trust/issues
Changelog: https://github.com/real-life-org/web-of-trust/releases

AutoName: Web of Trust

RepoType: git
Repo: https://github.com/real-life-org/web-of-trust.git

Builds:
  - versionName: 0.2.1
    versionCode: 3
    commit: a7ee51da7825b550366b043b2ee205c163f5d4da
    subdir: apps/demo/android/app
    sudo:
      - sysctl fs.inotify.max_user_watches=524288
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - corepack enable
      - corepack prepare pnpm@9.15.4 --activate
    init:
      - cd ../../../..
      - pnpm install --frozen-lockfile
      - export VITE_BASE_PATH=/ VITE_UPDATE_SERVER_URL=https://web-of-trust.de VITE_UPDATE_CHANNEL=android-foss
      - pnpm build
      - cd apps/demo
      - npx cap sync android
    gradle:
      - fdroid
    scanignore:
      - apps/demo/android/app/src/main/assets/public/assets
    scandelete:
      - node_modules
      - apps/demo/dist
      - apps/benchmark/dist
    ndk: r27c

# Diese Metadaten sind fuer eine spaetere OFFIZIELLE F-Droid-Aufnahme (fdroiddata)
# gedacht; unser eigenes Repo baut/signiert per wot-release, ohne sie zu lesen.
#
# Update-Automatik BEWUSST DEAKTIVIERT (None): version.properties fuehrt seit
# 31.07.2026 kein VERSION_CODE mehr — der wird aus VERSION_NAME abgeleitet
# (major*10000 + minor*100 + patch). Damit liefert kein UpdateCheckData einen
# numerischen versionCode-Capture. Vor der Einreichung hier eine valide
# UpdateCheckMode: Tags ^app-v + VercodeOperation ergaenzen, die den Code aus dem
# Namen bildet. Bis dahin NICHT so tun, als waere die Automatik aktiv.
AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.2.7
CurrentVersionCode: 207
