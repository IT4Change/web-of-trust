name: Publish Packages

on:
  # ACHTUNG: dieser Trigger feuert NICHT fuer Releases, die release-please als
  # github-actions[bot] anlegt — GitHub loest aus GITHUB_TOKEN-Events keine
  # Workflows aus. Er greift nur, wenn ein Mensch ein Release von Hand anlegt.
  # Der automatische Weg laeuft ueber den trigger-publish-Job in
  # release-please.yml, der hier per workflow_dispatch reinkommt.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, an das die tgz-Assets gehängt werden'
        required: true

jobs:
  # Tag-Klassifikation als EIGENER Job. Ein exit 0 im Step wuerde nur den Step
  # beenden — die Folge-Steps liefen mit leerem dir weiter (pack im Repo-Root,
  # Upload von nichts). Genau das tat der fruehere "Skip": wirkungslos. Ein
  # Job-level if ueberspringt dagegen den ganzen Publish-Job sauber und sichtbar.
  classify:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.c.outputs.kind }}
      dir: ${{ steps.c.outputs.dir }}
    steps:
      - id: c
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            core-v*)              kind=package; dir=packages/wot-core ;;
            adapter-yjs-v*)       kind=package; dir=packages/adapter-yjs ;;
            adapter-automerge-v*) kind=package; dir=packages/adapter-automerge ;;
            app-v*|v[0-9]*)
              # App-Releases sind eine ERWARTETE Tag-Klasse, aber kein npm-Paket.
              # (v[0-9]* deckt die Alt-Tags bis v0.2.7 ab. Das Release von v0.2.7
              # am 30.07. brach hier frueher rot ab.)
              echo "App-Release-Tag '$TAG' — kein npm-Publish noetig."
              kind=app; dir= ;;
            *)
              echo "ABBRUCH: Tag '$TAG' gehoert zu keinem publizierbaren Paket." >&2
              echo "Erwartet: core-v*, adapter-yjs-v*, adapter-automerge-v* (oder app-v*/v* als Skip)." >&2
              exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "dir=$dir"   >> "$GITHUB_OUTPUT"

  publish:
    needs: classify
    if: needs.classify.outputs.kind == 'package'
    runs-on: ubuntu-latest
    # Zwei Ziele, bewusst parallel:
    #   1. tgz-Assets am GitHub-Release — RLS konsumiert aktuell genau diese
    #      Tarball-URLs als Dependencies. Bleibt, bis RLS auf npm umgehaengt ist.
    #   2. npm via Trusted Publishing (OIDC). Der frühere Blocker (2FA/Passkey
    #      wurde nicht akzeptiert) ist weg, seit auf npmjs.com ein Trusted
    #      Publisher fuer real-life-org/web-of-trust + publish.yml hinterlegt ist.
    # Die Reihenfolge ist Absicht: erst die Assets, dann npm. Scheitert npm,
    # bleibt der Tarball-Pfad fuer RLS intakt und der Lauf trotzdem rot.
    permissions:
      contents: write
      # Ohne id-token kein OIDC-Token und damit kein Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim manuellen Re-Run MUSS auch der Checkout auf dem Ziel-Tag
          # stehen — sonst wuerden Tarballs vom main-HEAD mit --clobber die
          # Assets eines aelteren Releases ueberschreiben.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      # v2 ist zu alt fuer Trusted Publishing — genau daran scheiterte
      # pnpm/pnpm#11513, geloest durch ein Update der Action.
      # KEIN version:-Input. v4 bricht mit "Multiple versions of pnpm specified"
      # ab, wenn Workflow und packageManager (pnpm@9.15.4) unterschiedliche
      # Versionen nennen. ci.yml, deploy.yml und deploy-vnext.yml machen es
      # genauso und ueberlassen die Version der package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: |
          pnpm --filter @web_of_trust/core build
          pnpm --filter @web_of_trust/adapter-yjs build
          pnpm --filter @web_of_trust/adapter-automerge build

      # pnpm pack loest dabei "workspace:*" auf die konkrete Version auf. Genau
      # dieser Tarball wird spaeter unveraendert publiziert, npm-Paket und
      # Release-Asset sind damit byte-identisch.
      - name: Tarball packen
        id: pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/tgz
          pnpm -C "${{ needs.classify.outputs.dir }}" pack --pack-destination /tmp/tgz
          tarball=$(ls /tmp/tgz/*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -l "$tarball"

      # Fehler dürfen den Lauf NICHT grün lassen (das frühere `|| echo` hat
      # monatelang stille Auth-404s maskiert). --clobber macht den Upload
      # idempotent (Re-Run ersetzt vorhandene Assets).
      - name: Upload tarballs to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" /tmp/tgz/*.tgz --clobber

      # Trusted Publishing verlangt npm >= 11.5.1. Node 24 bringt das normalerweise
      # mit, aber die Runner-Version driftet. Explizit sicherstellen statt hoffen:
      # ein zu altes npm kennt den OIDC-Austausch nicht, faellt auf "kein Token"
      # zurueck und scheitert mit einem irrefuehrenden 404.
      - name: npm-Version für Trusted Publishing sicherstellen
        run: |
          npm install -g npm@latest
          npm --version

      # pnpm publish, nicht npm publish: adapter-yjs und adapter-automerge haben
      # "@web_of_trust/core": "workspace:*". pnpm schreibt das beim Packen auf die
      # konkrete Version um, npm nicht — ein npm-Publish lieferte ein package.json
      # aus, das sich beim Installieren nicht aufloesen laesst.
      # npm publish auf den fertigen Tarball, NICHT pnpm publish. Zwei Gruende:
      #  1. pnpm publish reicht sein eigenes --no-git-checks an npm durch, das
      #     den Flag nicht kennt und mit EUNKNOWNCONFIG abbricht. Ohne den Flag
      #     fragt pnpms Branch-Check interaktiv nach und haengt in CI.
      #  2. Der Tarball hat die workspace:*-Rewrites schon drin, das Argument
      #     fuer pnpm publish entfaellt damit.
      - name: Publish to npm (Trusted Publishing via OIDC)
        env:
          DIR: ${{ needs.classify.outputs.dir }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./$DIR/package.json').name")
          version=$(node -p "require('./$DIR/package.json').version")

          # npm view sauber auswerten statt nur den Exit-Code zu pruefen. npm
          # liefert fuer eine fehlende Version je nach Fall rc 0 mit LEERER
          # Ausgabe — ein `if npm view ... >/dev/null` haette den Publish dann
          # lautlos uebersprungen. Drei Faelle, drei Ausgaenge:
          #   rc 0 und Ausgabe == version       -> liegt bereits dort, skip
          #   E404 oder rc 0 mit leerer Ausgabe -> Version fehlt, publizieren
          #   jeder andere Fehler               -> ABBRUCH (Netz, Auth, Registry)
          set +e
          view_out=$(npm view "$name@$version" version 2>&1)
          view_rc=$?
          set -e

          if [ "$view_rc" -eq 0 ] && [ "$view_out" = "$version" ]; then
            echo "übersprungen: $name@$version liegt bereits auf npm"
            exit 0
          fi
          if [ "$view_rc" -ne 0 ] && ! printf '%s' "$view_out" | grep -q 'E404'; then
            echo "ABBRUCH: npm view für $name@$version fehlgeschlagen:" >&2
            printf '%s\n' "$view_out" >&2
            exit 1
          fi

          echo "publiziere $name@$version aus $TARBALL"
          npm publish "$TARBALL" --access public
