name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core_released: ${{ steps.release.outputs['packages/wot-core--release_created'] }}
      adapter-yjs_released: ${{ steps.release.outputs['packages/adapter-yjs--release_created'] }}
      adapter-automerge_released: ${{ steps.release.outputs['packages/adapter-automerge--release_created'] }}
      # Tag-Namen fuer den Publish-Anstoss unten. Nur Unterstriche im Namen, aus
      # Lesbarkeit — nicht weil Bindestriche nicht gingen. GitHub-Expressions
      # erlauben sie in der Punkt-Notation durchaus, `needs.release-please.…`
      # ist der Beweis. Die vorhandenen `*-released`-Outputs werden unten
      # trotzdem in Klammer-Notation gelesen, damit gar nicht erst die Frage
      # aufkommt.
      core_tag: ${{ steps.release.outputs['packages/wot-core--tag_name'] }}
      adapter_yjs_tag: ${{ steps.release.outputs['packages/adapter-yjs--tag_name'] }}
      adapter_automerge_tag: ${{ steps.release.outputs['packages/adapter-automerge--tag_name'] }}
      # Die App ist eine eigene release-please-Komponente (component "app") →
      # Tag app-vX.Y.Z. Der loest build-on-tag NICHT von selbst aus (GITHUB_TOKEN-
      # Tags triggern keine Workflows, s.u.) — deshalb der Dispatch-Job unten.
      app_released: ${{ steps.release.outputs['apps/demo--release_created'] }}
      app_tag: ${{ steps.release.outputs['apps/demo--tag_name'] }}
      # Die drei Dienste gehen nur als Docker-Image raus, nie ueber publish.yml.
      # Der Dispatcher unten braucht sie trotzdem: ohne sie sieht ein
      # Service-only-Release wie "gar nichts released" aus und der
      # Schema-Drift-Waechter schlaegt faelschlich an (#378).
      relay_released: ${{ steps.release.outputs['packages/wot-relay--release_created'] }}
      vault_released: ${{ steps.release.outputs['packages/wot-vault--release_created'] }}
      profiles_released: ${{ steps.release.outputs['packages/wot-profiles--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # Release-Please erzeugt die Releases als github-actions[bot] mit dem
  # GITHUB_TOKEN. GitHub loest aus solchen Events KEINE Workflows aus, um
  # Rekursion zu verhindern — der `on: release`-Trigger in publish.yml hat
  # deshalb nie gefeuert, und jedes Paket-Release brauchte einen manuellen
  # Anstoss, den niemand gemacht hat. Ergebnis: npm lag monatelang zurueck.
  #
  # workflow_dispatch ist von dieser Sperre ausdruecklich ausgenommen und
  # erzeugt auch mit dem GITHUB_TOKEN einen Lauf.
  #
  # Bewusst per Dispatch statt workflow_call: so laeuft publish.yml als
  # Top-Level-Workflow und das OIDC-Token nennt publish.yml. Genau darauf ist
  # der Trusted Publisher auf npmjs.com konfiguriert. Als aufgerufener Workflow
  # koennte der Anspruch stattdessen auf release-please.yml zeigen und npm den
  # Publish ablehnen.
  trigger-publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish je erzeugtem Release anstossen
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RELEASED: ${{ needs.release-please.outputs.core_released }}
          CORE_TAG: ${{ needs.release-please.outputs.core_tag }}
          YJS_RELEASED: ${{ needs.release-please.outputs['adapter-yjs_released'] }}
          YJS_TAG: ${{ needs.release-please.outputs.adapter_yjs_tag }}
          AUTOMERGE_RELEASED: ${{ needs.release-please.outputs['adapter-automerge_released'] }}
          AUTOMERGE_TAG: ${{ needs.release-please.outputs.adapter_automerge_tag }}
          # Fuer den started=0-Fall: nur ein NACHGEWIESENES Release von App oder
          # Dienst erklaert, dass kein npm-Paket dabei war.
          APP_RELEASED: ${{ needs.release-please.outputs.app_released }}
          RELAY_RELEASED: ${{ needs.release-please.outputs.relay_released }}
          VAULT_RELEASED: ${{ needs.release-please.outputs.vault_released }}
          PROFILES_RELEASED: ${{ needs.release-please.outputs.profiles_released }}
        # Die Logik liegt als Skript im Repo, nicht inline: so laesst sich jeder
        # Release-Zuschnitt trocken testen (scripts/release/test-dispatch-publish.mjs,
        # in der CI). Inline war sie erst im Ernstfall pruefbar — genau deshalb
        # blieb #378 unentdeckt.
        run: ./scripts/release/dispatch-publish.sh

  # Wurde die APP released (Tag app-vX.Y.Z), den nativen Build anstossen. Gleiche
  # Logik wie oben bei publish.yml: ein GITHUB_TOKEN-Tag triggert build-on-tag
  # nicht von selbst, workflow_dispatch schon. build-on-tag checkt inputs.tag aus,
  # also traegt build-info.commit den Tag-Commit — genau worauf die Signier-
  # Pipeline (verify_attested_artifact) bindet. Signiert/deployt wird danach auf
  # dem Server (Key-Verwahrung): docker compose run --rm signer|play-publish.
  trigger-app-build:
    needs: release-please
    if: needs.release-please.outputs.app_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: build-on-tag fuer den App-Tag anstossen
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TAG: ${{ needs.release-please.outputs.app_tag }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TAG" ]; then
            echo "ABBRUCH: app_released=true, aber kein app_tag-Output (Schema-Aenderung?)." >&2
            exit 1
          fi
          echo "starte build-on-tag fuer $APP_TAG"
          gh workflow run build-on-tag.yml --repo "$GITHUB_REPOSITORY" -f tag="$APP_TAG"
